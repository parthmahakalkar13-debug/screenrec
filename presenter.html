<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presenter Studio | CastWave RTC</title>
  
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --bg: #090d16;
      --surface: rgba(18, 26, 43, 0.75);
      --surface-border: rgba(255, 255, 255, 0.08);
      --primary: #4f46e5;
      --primary-glow: rgba(79, 70, 229, 0.35);
      --accent: #06b6d4;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 16px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.1) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .glass {
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius);
    }

    header {
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--surface-border);
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
    }

    .brand { display: flex; align-items: center; gap: 0.75rem; font-size: 1.15rem; font-weight: 700; }
    .brand-icon {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--surface-border);
    }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
    .status-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .status-dot.broadcasting { background: var(--danger); animation: pulse 1.5s infinite; }

    @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }

    main {
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 1rem;
    }

    @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

    .sidebar { display: flex; flex-direction: column; gap: 1rem; }
    .panel { padding: 1.25rem; display: flex; flex-direction: column; gap: 0.85rem; }

    .panel h2 {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .input-field { display: flex; flex-direction: column; gap: 0.35rem; }
    .input-field label { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }

    .input-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      font-family: monospace;
    }

    .btn {
      width: 100%;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: var(--transition);
    }

    .btn-primary { background: linear-gradient(135deg, var(--primary), #6366f1); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: var(--text); border: 1px solid var(--surface-border); }

    .audio-meter {
      height: 8px;
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--surface-border);
    }

    .audio-meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--success), var(--warning), var(--danger));
      transition: width 0.08s ease;
      border-radius: 999px;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #020408;
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--surface-border);
    }

    video { width: 100%; height: 100%; object-fit: contain; }

    .stage-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      padding: 1.5rem;
    }

    .stage-placeholder i { font-size: 2.5rem; color: rgba(255, 255, 255, 0.2); }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-size: 0.8rem;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transform: translateY(100px);
      opacity: 0;
      transition: var(--transition);
      z-index: 200;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon"><i class="ph-bold ph-screencast"></i></div>
      <span>CastWave <span style="color: var(--accent);">Presenter</span></span>
    </div>
    
    <div class="status-badge">
      <div class="status-dot" id="systemStatusDot"></div>
      <span id="systemStatusText">Connecting...</span>
    </div>
  </header>

  <main>
    <aside class="sidebar">
      <div class="glass panel">
        <h2><i class="ph ph-broadcast"></i> Presenter Source</h2>
        
        <div class="input-field">
          <label>Your Room ID (Copy to Viewer Device)</label>
          <div style="display: flex; gap: 0.5rem;">
            <input type="text" id="hostRoomId" class="input-box" readonly />
            <button class="btn btn-secondary" style="width: auto;" onclick="copyRoomId()" title="Copy ID">
              <i class="ph ph-copy"></i>
            </button>
          </div>
        </div>

        <div class="input-field">
          <label>Broadcast Mode</label>
          <select id="sourceType" class="input-box">
            <option value="camera_mic">Camera + Microphone (Works on PC & Mobile)</option>
            <option value="screen_mic">Screen Share + Microphone (Desktop/Laptop only)</option>
          </select>
        </div>

        <div class="input-field">
          <label>Microphone Audio Level</label>
          <div class="audio-meter">
            <div class="audio-meter-fill" id="hostAudioMeter"></div>
          </div>
        </div>

        <!-- Mute/Unmute Mic Toggle -->
        <button class="btn btn-secondary" id="toggleMicBtn" onclick="toggleMic()" style="display: none;">
          <i class="ph-bold ph-microphone" id="micIcon"></i> <span id="micText">Mute Mic</span>
        </button>

        <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem;">
          <button class="btn btn-primary" id="startShareBtn" onclick="startBroadcasting()">
            <i class="ph-bold ph-play"></i> Start Broadcasting
          </button>
          <button class="btn btn-danger" id="stopShareBtn" onclick="stopBroadcasting()" style="display: none;">
            <i class="ph-bold ph-stop"></i> Stop Broadcast
          </button>
        </div>
      </div>
    </aside>

    <section>
      <div class="stage">
        <video id="localVideoPreview" autoplay muted playsinline></video>
        <div class="stage-placeholder" id="stagePlaceholder">
          <i class="ph ph-video-camera"></i>
          <h3>Stream Inactive</h3>
          <p>Select your mode and click "Start Broadcasting" with microphone active.</p>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"><span id="toastMsg"></span></div>

  <script>
    let peer = null;
    let combinedStream = null;
    let micTrack = null;
    let audioContext = null;
    let analyser = null;

    const dom = {
      statusDot: document.getElementById('systemStatusDot'),
      statusText: document.getElementById('systemStatusText'),
      hostRoomId: document.getElementById('hostRoomId'),
      sourceType: document.getElementById('sourceType'),
      startShareBtn: document.getElementById('startShareBtn'),
      stopShareBtn: document.getElementById('stopShareBtn'),
      toggleMicBtn: document.getElementById('toggleMicBtn'),
      micIcon: document.getElementById('micIcon'),
      micText: document.getElementById('micText'),
      localVideo: document.getElementById('localVideoPreview'),
      stagePlaceholder: document.getElementById('stagePlaceholder'),
      hostAudioMeter: document.getElementById('hostAudioMeter'),
      toast: document.getElementById('toast'),
      toastMsg: document.getElementById('toastMsg')
    };

    function initPresenter() {
      const roomId = 'cast-' + Math.random().toString(36).substr(2, 6);
      peer = new Peer(roomId, {
        debug: 1,
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:global.stun.twilio.com:3478' }
          ]
        }
      });

      peer.on('open', (id) => {
        dom.hostRoomId.value = id;
        dom.statusDot.className = 'status-dot online';
        dom.statusText.textContent = `Online (${id})`;
        showToast('Room ID Generated.');
      });

      peer.on('call', (call) => {
        if (combinedStream) {
          call.answer(combinedStream);
          showToast('Viewer connected with Audio/Video!');
        } else {
          call.close();
        }
      });
    }

    async function startBroadcasting() {
      const mode = dom.sourceType.value;
      try {
        combinedStream = new MediaStream();

        // 1. Always capture Microphone
        const audioStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        micTrack = audioStream.getAudioTracks()[0];
        combinedStream.addTrack(micTrack);

        // 2. Capture Video (Camera or Screen)
        let videoStream;
        if (mode === 'camera_mic') {
          videoStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
          });
        } else {
          if (!navigator.mediaDevices.getDisplayMedia) {
            throw new Error("Screen sharing is only supported on desktop/laptop browsers.");
          }
          videoStream = await navigator.mediaDevices.getDisplayMedia({
            video: { frameRate: { ideal: 30 } }
          });
        }

        const videoTrack = videoStream.getVideoTracks()[0];
        combinedStream.addTrack(videoTrack);

        videoTrack.onended = () => stopBroadcasting();

        // Update local preview (muted locally to avoid acoustic feedback)
        dom.localVideo.srcObject = combinedStream;
        dom.stagePlaceholder.style.display = 'none';
        
        dom.startShareBtn.style.display = 'none';
        dom.stopShareBtn.style.display = 'flex';
        dom.toggleMicBtn.style.display = 'flex';
        dom.statusDot.className = 'status-dot broadcasting';
        dom.statusText.textContent = 'Broadcasting (Mic Live)';

        initAudioMonitor(combinedStream);
        showToast('Camera & Microphone are live!');
      } catch (err) {
        console.error(err);
        showToast(err.message || 'Permission denied or failed.');
      }
    }

    function toggleMic() {
      if (!micTrack) return;
      micTrack.enabled = !micTrack.enabled;
      if (micTrack.enabled) {
        dom.micIcon.className = "ph-bold ph-microphone";
        dom.micText.textContent = "Mute Mic";
        showToast("Microphone unmuted");
      } else {
        dom.micIcon.className = "ph-bold ph-microphone-slash";
        dom.micText.textContent = "Unmute Mic";
        dom.hostAudioMeter.style.width = '0%';
        showToast("Microphone muted");
      }
    }

    function stopBroadcasting() {
      if (combinedStream) {
        combinedStream.getTracks().forEach(t => t.stop());
        combinedStream = null;
      }
      micTrack = null;
      dom.localVideo.srcObject = null;
      dom.stagePlaceholder.style.display = 'flex';
      dom.startShareBtn.style.display = 'flex';
      dom.stopShareBtn.style.display = 'none';
      dom.toggleMicBtn.style.display = 'none';
      dom.statusDot.className = 'status-dot online';
      dom.statusText.textContent = `Online (${dom.hostRoomId.value})`;
      dom.hostAudioMeter.style.width = '0%';
      showToast('Broadcast stopped');
    }

    function initAudioMonitor(stream) {
      if (!stream.getAudioTracks().length) return;
      try {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 64;
        source.connect(analyser);

        const data = new Uint8Array(analyser.frequencyBinCount);
        const loop = () => {
          if (!combinedStream || !micTrack || !micTrack.enabled) {
            dom.hostAudioMeter.style.width = '0%';
            return;
          }
          analyser.getByteFrequencyData(data);
          let sum = 0;
          for (let i = 0; i < data.length; i++) sum += data[i];
          let pct = Math.min(100, Math.round(((sum / data.length) / 128) * 100));
          dom.hostAudioMeter.style.width = pct + '%';
          requestAnimationFrame(loop);
        };
        loop();
      } catch (e) { console.warn(e); }
    }

    function copyRoomId() {
      navigator.clipboard.writeText(dom.hostRoomId.value);
      showToast('Room ID copied!');
    }

    function showToast(msg) {
      dom.toastMsg.textContent = msg;
      dom.toast.classList.add('show');
      setTimeout(() => dom.toast.classList.remove('show'), 3500);
    }

    window.addEventListener('DOMContentLoaded', initPresenter);
  </script>
</body>
</html>
