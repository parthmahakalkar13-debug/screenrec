<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viewer Portal | CastWave RTC</title>
  
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --bg: #090d16;
      --surface: rgba(18, 26, 43, 0.75);
      --surface-border: rgba(255, 255, 255, 0.08);
      --primary: #4f46e5;
      --accent: #06b6d4;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 16px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.1) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .glass {
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius);
    }

    header {
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--surface-border);
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
    }

    .brand { display: flex; align-items: center; gap: 0.75rem; font-size: 1.15rem; font-weight: 700; }
    .brand-icon {
      background: linear-gradient(135deg, var(--accent), var(--primary));
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--surface-border);
    }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
    .status-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .status-dot.broadcasting { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

    main {
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1rem;
    }

    @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

    .sidebar { display: flex; flex-direction: column; gap: 1rem; }
    .panel { padding: 1.25rem; display: flex; flex-direction: column; gap: 0.85rem; }

    .panel h2 {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .input-field { display: flex; flex-direction: column; gap: 0.35rem; }
    .input-field label { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }

    .input-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      font-family: monospace;
    }

    .btn {
      width: 100%;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: var(--transition);
    }

    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--primary)); color: #fff; }
    .btn-warning { background: var(--warning); color: #000; font-weight: 700; }

    .audio-meter {
      height: 8px;
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--surface-border);
    }

    .audio-meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--success), var(--warning), var(--danger));
      transition: width 0.08s ease;
      border-radius: 999px;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #020408;
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--surface-border);
    }

    video { width: 100%; height: 100%; object-fit: contain; }

    .stage-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      padding: 1.5rem;
    }

    .stage-placeholder i { font-size: 2.5rem; color: rgba(255, 255, 255, 0.2); }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-size: 0.8rem;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transform: translateY(100px);
      opacity: 0;
      transition: var(--transition);
      z-index: 200;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon"><i class="ph-bold ph-eye"></i></div>
      <span>CastWave <span style="color: var(--accent);">Viewer</span></span>
    </div>
    
    <div class="status-badge">
      <div class="status-dot" id="systemStatusDot"></div>
      <span id="systemStatusText">Connecting...</span>
    </div>
  </header>

  <main>
    <aside class="sidebar">
      <div class="glass panel">
        <h2><i class="ph ph-plug"></i> Connect to Feed</h2>
        
        <div class="input-field">
          <label>Presenter Room ID</label>
          <input type="text" id="joinRoomId" class="input-box" placeholder="e.g. cast-984210" />
        </div>

        <button class="btn btn-primary" id="connectBtn" onclick="connectToBroadcast()">
          <i class="ph-bold ph-link"></i> Join Stream
        </button>

        <button class="btn btn-warning" id="unmuteBtn" onclick="enableAudio()" style="display: none;">
          <i class="ph-bold ph-speaker-high"></i> Tap to Enable Sound
        </button>

        <div class="input-field" style="margin-top: 0.5rem;">
          <label>Incoming Presenter Mic Level</label>
          <div class="audio-meter">
            <div class="audio-meter-fill" id="viewerAudioMeter"></div>
          </div>
        </div>
      </div>
    </aside>

    <section>
      <div class="stage">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="stage-placeholder" id="stagePlaceholder">
          <i class="ph ph-television"></i>
          <h3>No Stream Connected</h3>
          <p>Enter the Room ID from the presenter and tap "Join Stream".</p>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"><span id="toastMsg"></span></div>

  <script>
    let peer = null;
    let audioContext = null;
    let analyser = null;

    const dom = {
      statusDot: document.getElementById('systemStatusDot'),
      statusText: document.getElementById('systemStatusText'),
      joinRoomId: document.getElementById('joinRoomId'),
      remoteVideo: document.getElementById('remoteVideo'),
      stagePlaceholder: document.getElementById('stagePlaceholder'),
      viewerAudioMeter: document.getElementById('viewerAudioMeter'),
      unmuteBtn: document.getElementById('unmuteBtn'),
      toast: document.getElementById('toast'),
      toastMsg: document.getElementById('toastMsg')
    };

    function initViewer() {
      peer = new Peer({
        debug: 1,
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:global.stun.twilio.com:3478' }
          ]
        }
      });

      peer.on('open', (id) => {
        dom.statusDot.className = 'status-dot online';
        dom.statusText.textContent = 'Ready to Join';
        showToast('Connected to Signaling Server');
      });
    }

    function connectToBroadcast() {
      const targetRoom = dom.joinRoomId.value.trim();
      if (!targetRoom) {
        showToast('Please enter a valid Room ID');
        return;
      }

      showToast('Connecting to ' + targetRoom + '...');

      // Send empty canvas placeholder stream to initiate WebRTC call
      const canvas = document.createElement('canvas');
      canvas.width = 10; canvas.height = 10;
      const dummyStream = canvas.captureStream(1);

      const call = peer.call(targetRoom, dummyStream);

      call.on('stream', (remoteMediaStream) => {
        dom.remoteVideo.srcObject = remoteMediaStream;
        dom.stagePlaceholder.style.display = 'none';

        // Attempt autoplay with audio
        dom.remoteVideo.play().then(() => {
          dom.unmuteBtn.style.display = 'none';
        }).catch(() => {
          // If mobile browser blocks audio autoplay, show unmute button
          dom.unmuteBtn.style.display = 'flex';
          showToast('Tap "Tap to Enable Sound" to hear presenter');
        });

        initAudioMonitor(remoteMediaStream);

        dom.statusDot.className = 'status-dot broadcasting';
        dom.statusText.textContent = 'Receiving Live Mic & Video';
        showToast('Stream & Audio Connected');
      });

      call.on('close', () => {
        dom.remoteVideo.srcObject = null;
        dom.stagePlaceholder.style.display = 'flex';
        dom.statusDot.className = 'status-dot online';
        dom.statusText.textContent = 'Ready to Join';
        dom.unmuteBtn.style.display = 'none';
        dom.viewerAudioMeter.style.width = '0%';
        showToast('Presenter ended stream');
      });
    }

    function enableAudio() {
      dom.remoteVideo.muted = false;
      dom.remoteVideo.play();
      dom.unmuteBtn.style.display = 'none';
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
      }
      showToast('Sound enabled');
    }

    function initAudioMonitor(stream) {
      if (!stream.getAudioTracks().length) return;
      try {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 64;
        source.connect(analyser);

        const data = new Uint8Array(analyser.frequencyBinCount);
        const loop = () => {
          if (!stream.active) { dom.viewerAudioMeter.style.width = '0%'; return; }
          analyser.getByteFrequencyData(data);
          let sum = 0;
          for (let i = 0; i < data.length; i++) sum += data[i];
          let pct = Math.min(100, Math.round(((sum / data.length) / 128) * 100));
          dom.viewerAudioMeter.style.width = pct + '%';
          requestAnimationFrame(loop);
        };
        loop();
      } catch (e) { console.warn(e); }
    }

    function showToast(msg) {
      dom.toastMsg.textContent = msg;
      dom.toast.classList.add('show');
      setTimeout(() => dom.toast.classList.remove('show'), 3500);
    }

    window.addEventListener('DOMContentLoaded', initViewer);
  </script>
</body>
</html>
